<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Marshal</title>
  <style>
    body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.4 system-ui, sans-serif; color: #202124; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aa0a6; }
    .state { font-weight: 600; text-transform: capitalize; }
    [data-state="listening"] .dot { background: #d93025; animation: pulse 1s infinite; }
    [data-state="thinking"] .dot { background: #f9ab00; }
    [data-state="speaking"] .dot { background: #1a73e8; }
    [data-state="error"] .dot { background: #d93025; }
    @keyframes pulse { 50% { opacity: .3; } }
    .label { color: #5f6368; font-size: 11px; text-transform: uppercase; margin-top: 10px; }
    .box { background: #f1f3f4; border-radius: 6px; padding: 6px 8px; min-height: 18px; white-space: pre-wrap; word-break: break-word; }
    .err { color: #d93025; }
    button { margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
    .row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #5f6368; }
    a { color: #1a73e8; cursor: pointer; }
  </style>
</head>
<body data-state="idle">
  <h1><span class="dot"></span> Marshal: <span class="state" id="state">idle</span></h1>
  <div id="missing" class="err" hidden>API keys missing. <a id="openOptions2">Open settings</a></div>
  <div class="label">Transcript</div>
  <div class="box" id="transcript"></div>
  <div class="label">Result</div>
  <div class="box" id="result"></div>
  <div class="box err" id="error" hidden></div>
  <button id="talk">Talk again</button>
  <div class="row"><span>Shortcut: Alt+Shift+M</span><a id="openOptions">Settings</a></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
